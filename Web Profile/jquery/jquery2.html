<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum jQuery 2</title>
    <style>
        .kotak {
            font-family: "Poppins", sans-serif;
            font-size: 13px;
            width: 200px; 
            height: 100px;
            background-color: rgb(255, 255, 255);
            border: 3px solid rgb(0, 0, 0);
            border-radius: 10px;
            text-align: center; 
            line-height: 100px;
            margin-bottom: 10px; 
            transition: all 0.3s;
        }
        .sorot {
            font-family: "Poppins", sans-serif;
            color: rgb(255, 255, 255);
            border: 3px dashed rgb(0, 4, 255);
            border-radius: 20px;
            background-color: rgb(0, 0, 0);
            font-weight: bold;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div id="kotak-target" class="kotak">Arahkan kursor ke sini!</div>
    <button id="tombol-gaya">Ubah CSS Sekaligus (Chaining)</button>

    <script>
        $(document).ready(function() {
            // 1. Event Hover: Menerima 2 fungsi (kursor masuk & kursor keluar)
            $("#kotak-target").hover(
                function() { // Mouse Enter
                    $(this).addClass("sorot");
                },
                function() { // Mouse Leave
                    $(this).removeClass("sorot");
                }
            );

            // 2. Mengubah CSS sekaligus menggunakan objek JavaScript & .on()
            $("#tombol-gaya").click(function() {
                $("#kotak-target").css({
                    "font-family": "Poppins, sans-serif",
                    "font-size": "13px",
                    "background-color": "lightblue",
                    "color": "black",
                    "border-radius": "20px"
                });
            });
        });
    </script>
</body>
</html>
